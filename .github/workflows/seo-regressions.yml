name: SEO Regressions

on:
  pull_request:
    branches: [main, master]

jobs:
  seo-check:
    name: Run SEO Regression Checks
    runs-on: ubuntu-latest
    env:
      # Tests instantiate the browser client but never call this placeholder.
      # Production values remain managed by Lovable Cloud and are not exposed to CI.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SEO regression checks
        run: |
          npm run seo:check 2>&1 | tee seo-results.txt
          exit ${PIPESTATUS[0]}

      - name: Run unit test suite
        run: npm test

      - name: Check email template references
        run: npx tsx scripts/check-email-templates.ts

      - name: Check email delivery guard
        run: npx tsx scripts/check-email-delivery-guard.ts

      - name: Check role invariants
        run: npx tsx scripts/check-role-invariants.ts

      - name: Check payment & audit link integrity
        run: npx tsx scripts/check-payment-links.ts

      - name: Upload payment link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-links-report
          path: reports/payment-links.*

      - name: Generate HTML summary
        if: always()
        run: npx tsx scripts/seo-results-to-html.ts seo-results.txt seo-results.html

      - name: Upload SEO regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-regression-results
          path: |
            seo-results.txt
            seo-results.html
